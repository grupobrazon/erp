server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 50m;

  # Funções de backend (servidor Deno no mesmo Compose).
  location /functions/ {
    # Resolve na hora: o site sobe mesmo se o servidor de funções estiver reiniciando.
    resolver 127.0.0.11 valid=30s;
    set $functions_upstream http://functions:8000;
    proxy_pass $functions_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # Webhook da Base44 (avisos de mudança) -> ponte de sincronização.
  location /hooks/ {
    resolver 127.0.0.11 valid=30s;
    set $sync_upstream http://sync:8001;
    proxy_pass $sync_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 5m;
    access_log off;
  }

  # Arquivos com hash no nome: cache longo.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Aplicação de página única: qualquer rota volta para o index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  location = /healthz { access_log off; return 200 "ok\n"; }
}
